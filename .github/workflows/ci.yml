# FSSC 持续集成
# 触发：push / PR 到主干分支，或手动触发
# 覆盖：后端编译+单测、前端构建+单测、E2E 冒烟（可选，需 DB）
name: FSSC CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      run_e2e:
        description: '是否运行 E2E 冒烟（需 MySQL + 后端）'
        type: boolean
        default: false

concurrency:
  group: fssc-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 后端构建
  backend:
    name: 后端编译 + 单测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: mvn verify（含单元测试）
        working-directory: fssc/fssc-server
        run: mvn -B -ntp clean verify
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: fssc/fssc-server/**/target/surefire-reports/
          if-no-files-found: ignore

  # 前端构建
  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fssc/fssc-web/package-lock.json
      - name: 安装依赖
        working-directory: fssc/fssc-web
        run: npm ci --no-audit --no-fund
      - name: 单元测试（vitest）
        working-directory: fssc/fssc-web
        run: npm run test
      - name: 构建（vite build）
        working-directory: fssc/fssc-web
        run: npm run build
      - name: 上传构建产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fssc-web-dist
          path: fssc/fssc-web/dist*/
          if-no-files-found: ignore

  # E2E 冒烟
  e2e:
    name: E2E 冒烟（可选）
    if: github.event_name == 'workflow_dispatch' && inputs.run_e2e
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 123456
          MYSQL_DATABASE: fssc
        ports: [ '3306:3306' ]
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -p123456"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 初始化数据库
        run: bash scripts/db-init.sh
      - name: 打包后端
        working-directory: fssc/fssc-server
        run: mvn -B -ntp -DskipTests package
      - name: 启动后端
        run: |
          nohup bash scripts/run-server.sh --port 8089 > /tmp/server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8089/api/health && break || sleep 2
          done
      - name: 运行 E2E 冒烟
        run: python scripts/run-all-smokes.py
