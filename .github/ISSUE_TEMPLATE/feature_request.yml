name: 功能请求 Feature request
description: 提出新功能或改进建议
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        本项目 33 个业务域已覆盖财务共享主链路。提请求前请先看 `docs/module-map.md`
        与 `docs/workflow-engine.md` 的能力矩阵——**你要的功能可能已经存在但没接线**（大型代码库常见现象）。
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题（场景，不是方案）
      description: 用业务故事描述：谁、在什么环节、因为什么、卡在哪里。
      placeholder: 月末结账时共享中心要人工核对 20 家子公司的凭证完整性
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
      validations:
        required: true
  - type: dropdown
    id: domain
    attributes:
      label: 落在哪个域
      options:
        - expense / document / invoice / image
        - workflow / collab
        - sharing / compliance / audit / tracing
        - glex / gl / budget / report
        - arflow / apflow / receivable / treasury / payplan / bank / purchase
        - masterdata / asset / contract / customer / returns
        - system / auth / platform / framework / ai
        - 前端 / 构建 / 部署 / 文档
        - 新域
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 影响面自查（会动到哪一层）
      description: |
        请逐条回答，这是评审重点：
        - 是否需要新表/新列？→ 需要 Flyway 迁移与回滚脚本
        - 是否影响多租户隔离？→ 涉及查询层必须说明拦截器是否仍生效
        - 是否影响权限？→ 需要哪些新权限点、哪些角色获得
        - 是否影响已有流程模型？→ BPMN 版本与存量在途实例如何处理
        - 是否会改变现有接口的返回结构？→ 前端与第三方兼容性
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与不做会怎样
  - type: checkboxes
    id: willing
    attributes:
      label: 你是否愿意实现
      options:
        - label: 我愿意提 PR，并先开一个 Discussion 对齐方案（推荐）
