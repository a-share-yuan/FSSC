# 区别只是代理目标从 127.0.0.1:8089 换成 compose 网络里的服务名 backend。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 后端单文件上限 20MB（fssc.file.max-size），影像批次一次多张，这里留余量
    client_max_body_size 64m;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8089;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 报表导出、批量导入这类长请求：默认 60s 会把还在跑的连接掐断，前端只看到"请求失败"
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 静态资源优先命中；未命中回落 index.html。
    # 当前前端是 hash 路由（router.js createWebHashHistory），深链不会打到服务端路径，
    # 这一条真正生效的是 / 本身与漏文件的情况。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
