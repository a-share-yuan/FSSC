# ===== 数据源已迁移到下方 fssc.datasource.master / fssc.datasource.image（分库改造）=====
# DataSourceConfig 声明 DataSource bean 后，Boot 的 DataSourceAutoConfiguration 退避，
# 两个连接池属性按 Hikari 原生键（jdbc-url 等）直接绑定，不经 spring.datasource。

# Flowable 7：启动时自动建 ACT_*/FLW_* 表；不扫描 resources/processes
# G2 第 3 条（2026-09-24）：async-executor-activate 由 false 改为 true。
#   理由：超时改为「BPMN 边界定时器 + JavaDelegate」驱动，定时器与异步作业都写进 ACT_RU_TIMER_JOB /
#         ACT_RU_JOB，只有异步执行器在跑才会被拾取执行；关着等于定时器永远不触发（旧的 60 秒轮询
#         @Scheduled 与执行器无关，所以此前关掉也能"看起来正常"，掩盖了这个开关的必要性）。
#   影响：① 边界定时器、异步作业开始真实执行，超时处置会在到期时刻由引擎主动触发；
#         ② 存量已配 timeout_hours 的节点在下次模板同步/发布时会新增边界定时器，属行为变更；
#         ③ 异步线程池会额外占用少量线程与连接（默认配置足够，无需额外调参）。
flowable:
  database-schema-update: true
  async-executor-activate: true
  check-process-definitions: false

# 第三方接入开关（默认离线可跑；配置凭据即切换到真实实现）
fssc:
  # ===== 双数据源（分库改造：影像域独立 fssc_image 库）=====
  # master：主库 fssc（除影像 6 表外全部业务表 + Flowable + 平台表）
  # image ：影像库 fssc_image（img_batch/img_file/img_setting/image_exception/image_review/ocr_record）
  # 路由规则：默认 master；@FsscDataSource("image") 注解的类/方法经 AOP 切换到 image 库。
  datasource:
    master:
      jdbc-url: jdbc:mysql://127.0.0.1:3306/fssc?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_general_ci&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true&allowPublicKeyRetrieval=true&useSSL=false
      username: root
      # DB 口令外置：默认值仅供 dev/演示；生产用环境变量 FSSC_DB_PASSWORD 注入真实口令
      password: ${FSSC_DB_PASSWORD:123456}
      driver-class-name: com.mysql.cj.jdbc.Driver
      # 平台/租户共库；多租户靠 tenant_id 列 + 拦截器隔离，非靠独立 schema
      minimum-idle: 5
      maximum-pool-size: 40  # PERF-01: 20→40,消除30并发下的池排队(P95 2s→目标<1s)
      connection-timeout: 30000
    image:
      jdbc-url: jdbc:mysql://127.0.0.1:3306/fssc_image?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_general_ci&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true&allowPublicKeyRetrieval=true&useSSL=false
      username: root
      password: ${FSSC_DB_PASSWORD:123456}
      driver-class-name: com.mysql.cj.jdbc.Driver
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000
  # ===== 令牌签名（C-2 收敛后的 dev 侧显式放行，仅本 profile 生效）=====
  # allow-default-secret=true 的含义：允许沿用 application.yml 里的内置默认密钥，
  # TokenService 只打一行 WARN 后照常签发（本地/演示/01 册冒烟脚本零影响）。
  # 该开关缺省为 false，且只在 activeProfiles 含 dev 时才起作用 —— 生产 profile
  # 在 application-prod.yml 里写死 false 并把密钥改为 ${FSSC_JWT_SECRET:}，
  # 于是"默认密钥"与"密钥缺失"在生产一律走拒绝启动/拒绝签发的失败分支。
  # 真机生产环境请勿复制本行。
  jwt:
    allow-default-secret: true
  # ocr 引擎：mock（默认）/ tencent（需配置 SecretId/SecretKey）
  ocr:
    provider: mock
    tencent:
      secret-id:
      secret-key:
      region: ap-guangzhou
  # 银企直联：默认 DefaultBankGateway（模拟）；生产实现 HttpBankGateway 后切换
  bank:
    gateway: mock

mybatis-plus:
  configuration:
    # 打开 SQL 日志，便于观察租户拦截器注入的 WHERE tenant_id = ?
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
  # Mapper XML 位置（业务模块后续在此放 *Mapper.xml）
  mapper-locations: classpath*:/mapper/**/*.xml
