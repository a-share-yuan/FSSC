<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- 移动端适配：viewport-fit=cover 让 env(safe-area-inset-*) 在刘海屏/全面屏上真正生效，
       否则吸底 Tab Bar 与提交按钮会被 iOS 手势条、Android 三键导航遮住。
       不禁用缩放（maximum-scale=1 / user-scalable=no 会伤无障碍）：
       「聚焦输入不放大」改由输入字号 ≥16px 达成（见 styles/h5-tokens.css）。 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#409eff" />
  <!-- 内联图标：浏览器总会请求 /favicon.ico，缺文件会在每个页面留一条 404 控制台错误 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23409eff'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='white'%3EF%3C/text%3E%3C/svg%3E" />
  <!-- 未登录时的中性名；进入系统后由 useEditionBrand 按当前版本改写 -->
  <title>FSSC 财务管理系统</title>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
