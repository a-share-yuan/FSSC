# Prometheus 抓取配置（抓取间隔 15s，Token 鉴权见运维手册）
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'fssc-server'
    metrics_path: '/actuator/prometheus'
    authorization:
      type: Bearer
      credentials: '<从运维管理员处获取的监控专用Token>'
    static_configs:
      - targets: ['127.0.0.1:8089']
        labels:
          app: 'fssc-server'
          env: 'prod'

# 告警规则文件（配合 Alertmanager 或 Grafana Alerting）
rule_files:
  - 'alerts/fssc-alerts.yml'
